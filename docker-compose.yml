version: '3.8'

services:
  web:
    build: .
    # In production, we use the CMD from Dockerfile (gunicorn)
    # But for debugging purposes or local dev, you might override it. 
    # Here we stick to the image default.
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=khawarizm_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    restart: always

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=khawarizm_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    restart: always

volumes:
  postgres_data:
