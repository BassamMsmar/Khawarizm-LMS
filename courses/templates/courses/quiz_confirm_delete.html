{% extends 'base/base.html' %}

{% block content %}
<main class="main-content py-4">
  <div class="container">
    <div class="card shadow-lg p-4">
        <h1 class="h4 mb-3 text-danger">Delete Quiz</h1>
        <p class="mb-4">Are you sure you want to delete "<span class="fw-bold">{{ quiz.title }}</span>"?</p>
        <form method="post" class="d-inline-block">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Confirm Delete</button>
        </form>
        <a href="{% url 'courses:quiz_detail_crud' quiz.pk %}" class="btn btn-secondary">Cancel</a>
    </div> {# Close card #}
  </div> {# Close container #}
</main>
{% endblock %}
