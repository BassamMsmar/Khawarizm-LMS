{% load static %}
<div class="modal-header">
    <h5 class="modal-title">{% if form.instance.pk %}تعديل الاختبار{% else %}إضافة اختبار جديد{% endif %}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <div id="quizError" class="alert alert-danger" style="display: none;"></div>
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
                <div class="form-text">{{ field.help_text }}</div>
            {% endif %}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
    <button type="button" class="btn btn-primary" onclick="{% if form.instance.pk %}updateQuiz(){% else %}addQuiz(){% endif %}">{% if form.instance.pk %}حفظ التغييرات{% else %}إضافة{% endif %}</button>
</div>
