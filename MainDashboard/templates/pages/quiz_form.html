{% extends 'base/base.html' %}
{% load static %}

{% block content %}

    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{% if quiz %}Edit Quiz{% else %}Add Quiz{% endif %}</h2>
        </div>

        <!-- Quiz Form -->
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">{% if quiz %}Save Changes{% else %}Add Quiz{% endif %}</button>
                    <a href="{% url 'quiz_list' unit.id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>

{% endblock content %}
