{% extends 'base/base.html' %}
{% load static %}

{% block content %}

    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ unit.title }} - Quizzes</h2>
            <a href="{% url 'create_quiz' unit.id %}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-2"></i>Add Quiz
            </a>
        </div>

        <!-- Quizzes Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for quiz in quizzes %}
                                <tr>
                                    <td>{{ quiz.title }}</td>
                                    <td>
                                        <a href="{% url 'question_list' quiz.id %}" class="btn btn-sm btn-info">Manage Questions</a>
                                        <a href="{% url 'update_quiz' quiz.id %}" class="btn btn-sm btn-primary">Edit</a>
                                        <a href="{% url 'delete_quiz' quiz.id %}" class="btn btn-sm btn-danger">Delete</a>
                                    </td>
                                </tr>
                            {% empty %}
                                <tr>
                                    <td colspan="2" class="text-center">No quizzes found.</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

{% endblock content %}
