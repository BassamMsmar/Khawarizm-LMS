{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<main class="main-content">
    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{% if lesson %}Edit Lesson{% else %}Add Lesson{% endif %}</h2>
        </div>

        <!-- Lesson Form -->
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">{% if lesson %}Save Changes{% else %}Add Lesson{% endif %}</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock content %}
