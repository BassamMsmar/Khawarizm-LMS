{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<main class="main-content">
    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ unit.title }} - Lessons</h2>
            <a href="{% url 'create_lesson' unit.id %}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-2"></i>Add Lesson
            </a>
        </div>

        <!-- Lessons Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Order</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for lesson in lessons %}
                                <tr>
                                    <td>{{ lesson.title }}</td>
                                    <td>{{ lesson.order }}</td>
                                    <td>
                                        <a href="{% url 'update_lesson' lesson.id %}" class="btn btn-sm btn-primary">Edit</a>
                                        <a href="{% url 'delete_lesson' lesson.id %}" class="btn btn-sm btn-danger">Delete</a>
                                    </td>
                                </tr>
                            {% empty %}
                                <tr>
                                    <td colspan="3" class="text-center">No lessons found.</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock content %}
