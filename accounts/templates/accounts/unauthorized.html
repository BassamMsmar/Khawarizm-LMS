<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صلاحيات غير كافية</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#7dd3fc;
      --muted:#9ca3af;
    }
    *{box-sizing:border-box;font-family:"Cairo", "Tajawal", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{margin:0;background:linear-gradient(180deg,#071021 0%, #0b1420 100%);color:#e6eef8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;direction:rtl;}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:12px;padding:32px;max-width:820px;width:100%;box-shadow:0 8px 30px rgba(2,6,23,0.6);display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:center;}
    .left h1{font-size:28px;margin:0 0 8px;}
    .left p{color:var(--muted);margin:0 0 18px;line-height:1.7;}
    .btns{display:flex;gap:12px;flex-wrap:wrap;}
    .btn{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block;}
    .btn-primary{background:var(--accent);color:#022033;}
    .btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#cbd5e1;}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:#a5b4c5;display:inline-block;margin-top:10px;}
    .right{display:flex;align-items:center;justify-content:center}
    .shield{width:160px;height:160px;border-radius:14px;background:linear-gradient(180deg,#04263a,#083047);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -8px 24px rgba(0,0,0,0.5);}
    .shield svg{width:90px;height:90px;opacity:0.95;transform:scaleX(-1);}
    @media (max-width:900px){
      .card{grid-template-columns:1fr; padding:22px;}
      .right{order:-1;margin-bottom:8px}
    }
  </style>
</head>
<body>
  <div class="card" role="alert" aria-labelledby="title">
    <div class="left">
     <h1>اكاديميه خوارزم </h1>
     <br>
      <h1 id="title">تم رفض الوصول — لا تملك الصلاحية الكافية</h1>
      <p>يبدو أنك لا تملك الدور أو الصلاحية المطلوبة لعرض هذه الصفحة. إذا كنت ترى أن هذا خطأ، يُرجى التواصل مع مدير النظام أو طلب صلاحيات إضافية.</p>

      <div class="btns">
        <a href="{% url 'home' %}" class="btn btn-secondary">العودة إلى الصفحة الرئيسية</a>
      </div>

      <div style="margin-top:18px;color:var(--muted);font-size:13px;">
        رمز الخطأ: <span class="code">403 - غير مصرح</span>
      </div>
    </div>

    <div class="right">
      <div class="shield" aria-hidden="true">
        <!-- أيقونة الدرع -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l7 3v5c0 5-3.5 9.6-7 12-3.5-2.4-7-7-7-12V5l7-3z" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
