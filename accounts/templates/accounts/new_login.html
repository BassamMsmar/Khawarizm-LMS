{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #e0f2f7; /* Light blue background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl; /* Right-to-left direction for Arabic */
            text-align: right;
        }
        .login-container {
            background-color: #ffffff;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.8s ease-out;
            position: relative; /* Added for positioning the home icon */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }n            to { opacity: 1; transform: translateY(0); }
        }
        .login-container h2 {
            margin-bottom: 35px;
            color: #0056b3; /* Darker blue for heading */
            text-align: center;
            font-weight: 700;
            font-size: 2.2rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 22px;
            border: 1px solid #b3e5fc; /* Light blue border */
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.15rem;
            font-weight: 600;
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: translateY(-2px);
        }
        .text-center a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .text-center a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
        .mt-3 {
            margin-top: 1.5rem !important;
        }
        .home-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            color: #007bff;
            transition: color 0.3s ease;
        }
        .home-icon:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="/" class="home-icon" title="العودة للصفحة الرئيسية">
            <i class="bi bi-house-fill"></i>
        </a>
        <h2>تسجيل الدخول</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
        </form>
        <p class="text-center mt-3">
            ليس لديك حساب؟ <a href="#">إنشاء حساب</a>
        </p>
        <p class="text-center">
            <a href="#">هل نسيت كلمة المرور؟</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
